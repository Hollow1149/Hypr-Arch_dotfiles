##########################
### Yazi Configuration ###
##########################

[mgr]
sort_by = "natural"
sort_sensitive = false
sort_dir_first = true
show_hidden = false
show_symlink = false

[preview]
wrap = "yes"

### Plugins ###
[plugin]
prepend_preloaders = [
  { mime = "{audio,video,image}/*", run = "mediainfo" },
  { mime = "application/subrip", run = "mediainfo" },
  { mime = "application/postscript", run = "mediainfo" },
]

prepend_previewers = [
  { mime = "{audio,video,image}/*", run = "mediainfo" },
  { mime = "application/subrip", run = "mediainfo" },
  { mime = "application/postscript", run = "mediainfo" },
  # Archive previewer
  { mime = "application/*zip", run = "ouch" },
  { mime = "application/x-tar", run = "ouch" },
  { mime = "application/x-bzip2", run = "ouch" },
  { mime = "application/x-7z-compressed", run = "ouch" },
  { mime = "application/x-rar", run = "ouch" },
  { mime = "application/vnd.rar", run = "ouch" },
  { mime = "application/x-xz", run = "ouch" },
  { mime = "application/xz", run = "ouch" },
  { mime = "application/x-zstd", run = "ouch" },
  { mime = "application/zstd", run = "ouch" },
  { mime = "application/java-archive", run = "ouch" },
]

# For opening files with application #

[opener]

localsend_opt = [
  { run = 'uwsm-app -- localsend %s', orphan = true, desc = "Share via LocalSend" },
]

image_options = [
  { run = 'uwsm-app -- gimp %s', orphan = true, desc = "Edit in GIMP" },
  { run = 'uwsm-app -- $HOME/.local/bin/myScripts/wallpaperRelated/wallpaperSelect.sh --set %s', orphan = true, desc = "Set as Wallpaper" },
]

[open]

rules = [
  # Folder
  { url = "*/", use = [
    "edit",
    "open",
    "reveal",
    "localsend_opt",
  ] },
  # Text
  { mime = "text/*", use = [
    "edit",
    "reveal",
    "localsend_opt",
  ] },
  # Image
  { mime = "image/*", use = [
    "open",
    "reveal",
    "image_options",
    "localsend_opt",
  ] },
  # Media
  { mime = "{audio,video}/*", use = [
    "play",
    "reveal",
    "localsend_opt",
  ] },
  # Code
  { mime = "application/{json,ndjson,javascript,wine-extension-ini}", use = [
    "edit",
    "reveal",
    "localsend_opt",
  ] },
  # Archive
  { mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", use = [
    "extract",
    "reveal",
    "localsend_opt",
  ] },
  # Empty file
  { mime = "inode/empty", use = [
    "edit",
    "reveal",
    "localsend_opt",
  ] },
  # Virtual file system
  { mime = "vfs/{absent,stale}", use = "download" },
  # Trash
  { mime = "trash/**", use = [
    "open",
    "trash",
  ] },
  # Fallback
  { url = "*", use = [
    "open",
    "reveal",
    "localsend_opt",
  ] },
]
