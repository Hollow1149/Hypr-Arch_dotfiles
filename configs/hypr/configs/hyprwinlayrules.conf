####################
### WINDOW RULES ###
####################

# See https://wiki.hypr.land/Configuring/Window-Rules/ for more
# See https://wiki.hypr.land/Configuring/Workspace-Rules/ for workspace rules

# Windowrule for applications
windowrule {
  name = float-thunar
  match:class = thunar
  float = on
  size = (monitor_w*0.6) (monitor_h*0.7)
  center = on
}

windowrule {
  name = float-xdg-desktop-portal-gtk
  match:class = xdg-desktop-portal-gtk
  float = on
  size = (monitor_w*0.5) (monitor_h*0.7)
  center = on
}


windowrule {
  name = float-gimp-submenus
  match:class = script-fu
  match:initial_class = script-fu
  float = on  
  size = (monitor_w*0.4) (monitor_h*0.6)
  center = on
}

windowrule {
  name = float-zen-download-menu
  match:title = Library
  match:initial_title = Library
  float = on 
  size = (monitor_w*0.5) (monitor_h*0.7)
  center = on
  stay_focused = on
}

windowrule {
  name = float-zen-pip
  match:title = Picture-in-Picture
  match:initial_title = Picture-in-Picture
  float = on 
  size = (monitor_w*0.3) (monitor_h*0.3)
  move = 1342 754
}

windowrule {
  name = float-abdownload-menu
  match:class = com-abdownloadmanager-desktop-AppKt
  float = on
}

windowrule {
  name = float-abdownload-menu
  match:class = com-abdownloadmanager-desktop-AppKt
  match:title = AB Download Manager
  float = off
}

windowrule {
  name = float-tor-launcher
  match:title = Tor Browser Launcher Settings
  float = on
  center = on
  size = (monitor_w*0.3) (monitor_h*0.2)
}

windowrule {
  name =float-loupe
  match:initial_class = org.gnome.Loupe
  float = on
  center = on
  size = (monitor_w*0.7) (monitor_h*0.8)
}

windowrule {
  name = float-Qalculate
  match:class = qalculate-gtk
  match:title = Qalculate!
  float = on
  size = (monitor_w*0.5) (monitor_h*0.7)
  center = on
}

windowrule {
  name = float-mpv
  match:initial_class = mpv
  float = on
  size = (monitor_w*0.76) (monitor_h*0.76)
  center = on
}

windowrule {
  name = float-zenity
  match:class = zenity
  float = on
}

windowrule {
  name = gimpWS3
  match:class = gimp
  workspace = 3
}

windowrule {
  name = float-satty
  match:initial_class = com.gabm.satty 
  float = on 
  size = (monitor_w*0.6) (monitor_h*0.7)
  center = on
}

windowrule {
  name = pin-webcamOverlay
  match:title = WebcamOverlay
  pin = on
}

windowrule {
  name = pseudotile-kitty
  match:class = kitty
  match:title = kitty
  pseudo = off
  size = (monitor_w*0.9) (monitor_h*0.95)
}

windowrule {
  name = float-impala
  match:initial_title = wifi-tui
  size = (monitor_w*0.5) (monitor_h*0.6)
  float = on
  center = on
  stay_focused = on
  pin = on
}

windowrule {
  name = float-bluetui
  match:initial_title = bluetooth-tui
  size = (monitor_w*0.5) (monitor_h*0.6)
  float = on
  center = on
  stay_focused = on
  pin = on
}

windowrule {
  name = float-position-volume-control
  match:class = org.pulseaudio.pavucontrol
  match:title = Volume Control
  float = on
  size = (monitor_w*0.3) (monitor_h*0.4)
  move = 1342 34
  pin = on
  stay_focused = on
}

windowrule {
  name = float-position-networkEditor
  match:class = nm-connection-editor
  match:initial_class = nm-connection-editor
  float = on
  size = (monitor_w*0.3) (monitor_h*0.533)
  move = 1342 34
  pin = on
  stay_focused = on
}

windowrule {
  name = float-position-blueman
  match:class = blueman-manager
  match:initial_class = blueman-manager
  float = on
  size = (monitor_w*0.3) (monitor_h*0.533)
  move = 1342 34
  pin = on
  stay_focused = on
}

windowrule {
    # Ignore maximize requests from all apps. You'll probably like this.
    name = suppress-maximize-events
    match:class = .*

    suppress_event = maximize
}

windowrule {
    # Fix some dragging issues with XWayland
    name = fix-xwayland-drags
    match:class = ^$
    match:title = ^$
    match:xwayland = true
    match:float = true
    match:fullscreen = false
    match:pin = false

    no_focus = true
}

# Hyprland-run windowrule
windowrule {
    name = move-hyprland-run

    match:class = hyprland-run

    move = 20 monitor_h-120
    float = yes
}

windowrule = match:initial_title Zen Browser, workspace 2
windowrule = match:class eden, no_blur on, no_shadow on, opaque on

###################
### Layer rules ###
###################

# Blur Layerrules
layerrule = blur on, match:namespace waybar
layerrule = ignore_alpha 0.1, match:namespace waybar

layerrule = blur on, match:namespace swaync-control-center
layerrule = ignore_alpha 0.2, match:namespace swaync-control-center

layerrule = blur on, match:namespace swaync-notification-window
layerrule = ignore_alpha 0.2, match:namespace swaync-notification-window

layerrule = blur on, match:namespace rofi
layerrule = ignore_alpha 0.1, match:namespace rofi

# Animation Layerrules
layerrule = animation fadeIn, match:namespace selection
layerrule = animation fadeIn, match:namespace hyprpicker
layerrule = animation fadeIn, match:namespace logout_dialog

layerrule = animation slide right, match:namespace swaync-control-center

# Ref https://wiki.hypr.land/Configuring/Workspace-Rules/
# "Smart gaps" / "No gaps when only"
# uncomment all if you wish to use that.
# workspace = w[tv1], gapsout:0, gapsin:0
# workspace = f[1], gapsout:0, gapsin:0
# windowrule = bordersize 0, floating:0, onworkspace:w[tv1]
# windowrule = rounding 0, floating:0, onworkspace:w[tv1]
# windowrule = bordersize 0, floating:0, onworkspace:f[1]
# windowrule = rounding 0, floating:0, onworkspace:f[1]

#######################
### Workspace-Rules ###
#######################
workspace = 1, layout:scrolling
workspace = special:magic, layout:scrolling
