#####################
### LOOK AND FEEL ###
#####################

# Refer to https://wiki.hypr.land/Configuring/Variables/

# https://wiki.hypr.land/Configuring/Variables/#general
general {
    gaps_in = 3
    gaps_out = 5

    border_size = 0

    # https://wiki.hypr.land/Configuring/Variables/#variable-types for info about colors
    col.active_border = $primary
    col.inactive_border = $outline_variant

    # Set to true enable resizing windows by clicking and dragging on borders and gaps
    resize_on_border = false

    # Please see https://wiki.hypr.land/Configuring/Tearing/ before you turn this on
    allow_tearing = false

    layout = dwindle
}

# https://wiki.hypr.land/Configuring/Variables/#decoration
decoration {
    rounding = 10
    rounding_power = 10

    # Change transparency of focused and unfocused windows
    active_opacity = 1.0
    inactive_opacity = 0.9
    dim_inactive = true
    dim_strength = 0.1
    # screen_shader = $HOME/.config/hypr/shaders/21_crtshader3.glsl

    shadow {
        enabled = true
        range = 4
        render_power = 3
        color = rgba(1a1a1aee)
    }

    # https://wiki.hypr.land/Configuring/Variables/#blur
    blur {
        enabled = true
        size = 8
        passes = 3
        new_optimizations = true
        ignore_opacity=true
        xray=false
        popups=true

        vibrancy = 0.1696
        noise=0.0117
    }
}

# https://wiki.hypr.land/Configuring/Variables/#animations
animations {
  enabled = yes, please :)

  # Default curves, see https://wiki.hypr.land/Configuring/Animations/#curves
  #        NAME,           X0,    Y0,   X1,   Y1
  bezier = quick,          0.15,  0,    0.1,  1
  bezier = linear,         0,     0,    1,    1
  bezier = almostLinear,   0.5,   0.5,  0.75, 1
  bezier = easeInSine,     0.12,  0,    0.39, 0
  bezier = easeOutSine,    0.61,  1,    0.88, 1
  bezier = easeOutQuint,   0.23,  1,    0.32, 1
  bezier = easeInOutCubic, 0.65,  0.05, 0.36, 1
  bezier = easeOutbounce,  0.34,  1.56, 0.64, 1
  bezier = easeInQuart,    0.5,   0,    0.75, 0
  bezier = easeOutQuart,   0.165, 0.84, 0.44, 1
  bezier = easeInQuad,     0.11,  0,    0.5,  0
  bezier = easeOutQuad,    0.5,   1,    0.89, 1
  bezier = easeInOutQuad,  0.45,  0,    0.55, 1
  bezier = easeInExpo,     0.7,   0,    0.84, 0
  bezier = easeOutExpo,    0.16,  1,    0.3,  1
  bezier = easeInOutExpo,  0.87,  0,    0.13, 1
  bezier = easeInCirc,     0.55,  0,    1,    0.45
  bezier = easeOutCirc,    0,     0.55, 0.45, 1
  bezier = easeInOutCirc,  0.85,  0,    0.15, 1


  # Default animations, see https://wiki.hypr.land/Configuring/Animations/ for more
  #           NAME,          ONOFF, SPEED, CURVE,        [STYLE]
  animation = global,        1,     10,    default
  animation = border,        1,     5.39,  easeOutQuart
  animation = windows,       1,     4.79,  easeOutQuart
  animation = windowsIn,     1,     3.55,  easeOutQuart, popin 87%
  animation = windowsOut,    1,     1.49,  linear,       popin 87%
  animation = fadeIn,        1,     1.73,  almostLinear
  animation = fadeOut,       1,     1.46,  almostLinear
  animation = fade,          1,     3.03,  quick
  animation = layers,        1,     3.81,  easeOutQuint
  animation = layersIn,      1,     3.2,   easeOutQuint, slide
  animation = layersOut,     1,     1.5,   linear,       slide
  animation = fadeLayersIn,  1,     1.79,  almostLinear
  animation = fadeLayersOut, 1,     1.39,  almostLinear
  animation = workspaces,    1,     4,     easeOutQuart,  slidefade 50%
  animation = workspacesIn,  1,     3,     easeInOutExpo, slidefade 80%
  animation = workspacesOut, 1,     3,     easeInOutExpo, slidefade 80%
}

# See https://wiki.hypr.land/Configuring/Dwindle-Layout/ for more
dwindle {
    preserve_split = true # You probably want this
}

# See https://wiki.hypr.land/Configuring/Master-Layout/ for more
master {
    new_status = master
}

scrolling {
  direction = right
  column_width = 0.8
  follow_focus = true
  fullscreen_on_one_column = false
}

# https://wiki.hypr.land/Configuring/Variables/#misc
misc {
    force_default_wallpaper = 0 # Set to 0 or 1 to disable the anime mascot wallpapers
    disable_hyprland_logo = true # If true disables the random hyprland logo / anime girl background. :(
    vrr = 2
}

