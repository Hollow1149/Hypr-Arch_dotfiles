source=~/.config/hypr/configs/hyprcolor.conf

# BACKGROUND
background {
    monitor =
    path = screenshot
    blur_passes = 2
    contrast = 1
    brightness = 0.6
    vibrancy = 0.2
    vibrancy_darkness = 0.2
}

# GENERAL
general {
    hide_cursor = false
}

bezier = snappyEase, 0.3, 0.0, 0.2, 1.0

# ANIMATIONS
animations {
  enabled = true 
  animation = fadeIn, 1, 6, snappyEase, linear;
  animation = fadeOut, 1, 6, snappyEase, linear;
}

# INPUT FIELD
input-field {
  monitor =
  size = 250, 60
  outline_thickness = 2
  dots_size = 0.2 # Scale of input-field height, 0.2 - 0.8
  dots_spacing = 0.35 # Scale of dots' absolute size, 0.0 - 1.0
  dots_center = true
  dots_rounding = 1
  outer_color = rgba(0, 0, 0, 0)
  inner_color = rgba(0, 0, 0, 0.2)
  font_color = $on_primary_container
  font_family = Pixelify Sans
  fade_on_empty = false
  rounding = 10
  fail_color = $error
  fail_text = <i> Incorrect Spell </i><br/><span size='small'>$FAIL</span>
  check_color = $secondary
  placeholder_text = <span foreground="##cdd6f4"> </span>
  hide_input = false
  position = 0, -200
  halign = center
  valign = center
}

# TIME
label {
  monitor = 
  text = cmd[update:1000] echo "$(date +"%H")"
  color = $primary
  font_size = 50
  font_family = Pixelify Sans Bold
  position = -100, -30
  halign = right
  valign = top
}

label {
  monitor = 
  text = cmd[update:1000] echo "$(date +"%M")"
  color = $tertiary
  font_size = 50
  font_family = Pixelify Sans
  position = -10, -30
  halign = right
  valign = top
}

# DATE
label {
  monitor =
  text = cmd[update:1000] echo "$(date +"%A, %B %d")"
  color = $secondary
  font_size = 15
  font_family = Pixelify Sans Bold
  position = -10, -100
  halign = right
  valign = top
}

