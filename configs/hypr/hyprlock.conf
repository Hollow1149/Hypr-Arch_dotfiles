###### Music Related ######

image {
    monitor = 
    size = 150 # lesser side if not 1:1 ratio
    rounding = 20 # negative values mean circle
    border_size = 0
    border_color =  $outline
    rotate = 0 # degrees, counter-clockwise
    reload_time = 2
    reload_cmd = ~/.config/hypr/scripts/art.sh
    position = -10, 100
    halign = right
    valign = bottom
    zindex = 1
}

label {
    monitor =
    text = cmd[update:1000] echo "$(/home/Artemis/.config/hypr/scripts/songdetail.sh --status)" 
    color = $tertiary
    #color = rgba(255, 255, 255, 0.6)
    font_size = 9
    font_family = Source Code Pro Bold
    position = -10, 35
    halign = right
    valign = bottom
    zindex = 1
}

label {
    monitor =
    text = cmd[update:1000] echo "$(/home/Artemis/.config/hypr/scripts/songdetail.sh --title)" 
    color = $on_surface_variant
    #color = rgba(255, 255, 255, 0.6)
    font_size = 15
    font_family = Source Code Pro Bold
    position = -10, 70
    halign = right
    valign = bottom
    zindex = 1
}

label {
    monitor =
