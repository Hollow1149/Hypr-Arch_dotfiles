version = 4
final_space = true

[upgrade]
source = 'cdn'
interval = '168h'
auto = false
notice = false

[[blocks]]
type = 'prompt'
alignment = 'left'

[[blocks.segments]]
template = '{{.Icon}} '
foreground = 'default'
type = 'os'
style = 'plain'

[[blocks.segments]]
template = '{{ .UserName }}@{{ .HostName }} '
foreground = 'magenta'
type = 'session'
style = 'plain'

[[blocks.segments]]
template = '{{ .Path }} '
foreground = 'blue'
type = 'path'
style = 'plain'

[blocks.segments.options]
folder_icon = '....'
home_icon = '~'
max_depth = 5
style = 'agnoster_short'

[[blocks.segments]]
template = '{{ .HEAD }}{{ if or (.Working.Changed) (.Staging.Changed) }}*{{ end }} <cyan>{{ if gt .Behind 0 }}󱦳{{ end }}{{ if gt .Ahead 0 }}󱦲{{ end }}</>'
foreground = 'yellow'
type = 'git'
style = 'plain'

[blocks.segments.options]
branch_icon = ' '
cherry_pick_icon = ' '
commit_icon = ' '
fetch_status = true
fetch_upstream_icon = false
merge_icon = ' '
no_commits_icon = ' '
rebase_icon = ' '
revert_icon = ' '
tag_icon = ' '

[[blocks.segments]]
type = "python"
style = "plain"
foreground = 'blue'
background = 'transparent'
template = " {{ if .Error }}{{ .Error }}{{ else }}{{ if .Venv }}{{ .Venv }} {{ end }}{{ .Full }}{{ end }} "

[[blocks]]
type = 'rprompt'
overflow = 'hidden'

[[blocks.segments]]
type = 'executiontime'
style = 'plain'
foreground = 'red'
background = 'transparent'

[blocks.segments.properties]
threshold = 5000
style = 'austin'

[[blocks]]
type = 'prompt'
alignment = 'left'
newline = true

[[blocks.segments]]
type = 'text'
style = 'plain'
foreground_templates = [
  "{{ if gt .Code 0 }}red{{ end }}",
  "{{ if eq .Code 0 }}green{{ end }}",
]
template = '❱'

[transient_prompt]
background = "transparent"
foreground_templates = [
  "{{ if gt .Code 0 }}red{{ end }}",
  "{{ if eq .Code 0 }}green{{ end }}",
]
template = "❱ "

[secondary_prompt]
foreground = 'green'
background = 'transparent'
template = ' '
