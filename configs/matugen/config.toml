[config]

caching = true

[templates.hyprcolors]
input_path = '~/.config/matugen/templates/hyprcolors.template'
output_path = '~/.config/hypr/configs/hyprcolor.lua'

[templates.kitty]
input_path = '~/.config/matugen/templates/kitty.conf'
output_path = '~/.config/kitty/kittycolors.conf'
post_hook = 'pkill -SIGUSR1 kitty || true'

[templates.rofi]
input_path = '~/.config/matugen/templates/rofi.rasi'
output_path = '~/.config/rofi/launcher-themes/colors.rasi'

[templates.waybar]
input_path = '~/.config/matugen/templates/waybar.template'
output_path = '~/.config/waybar/colors.css'

[templates.qt5ct]
input_path = '~/.config/matugen/templates/qtct-colors.conf'
output_path = '~/.config/qt5ct/colors/matugen.conf'

[templates.qt6ct]
input_path = '~/.config/matugen/templates/qtct-colors.conf'
output_path = '~/.config/qt6ct/colors/matugen.conf'

[templates.gtk3]
input_path = '~/.config/matugen/templates/gtk-colors.template'
output_path = '~/.config/gtk-3.0/colors.css'
post_hook = 'gsettings set org.gnome.desktop.interface gtk-theme ""; gsettings set org.gnome.desktop.interface gtk-theme adw-gtk3-dark'

[templates.gtk4]
input_path = '~/.config/matugen/templates/gtk-colors.template'
output_path = '~/.config/gtk-4.0/colors.css'

[templates.cava]
input_path = '~/.config/matugen/templates/cava-colors.in'
output_path = '~/.config/cava/themes/matugenTheme'
post_hook = 'pkill -USR1 cava || true'

[templates.btop]
input_path = '~/.config/matugen/templates/btop.theme'
output_path = '~/.config/btop/themes/matugen.theme'
post_hook = 'pkill -SIGUSR2 btop || true'

[templates.swaync]
input_path = '~/.config/matugen/templates/swaync.template'
output_path = '~/.config/swaync/colors.css'

[templates.wlogout]
input_path = '~/.config/matugen/templates/wlogout.template'
output_path = '~/.config/wlogout/colors.css'
